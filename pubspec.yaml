name: lr_management
description: "Vistar Transport Management System (VTMS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Raised from ^3.11.5 so the toolchain the team actually runs is the one the
  # pubspec declares, and so `very_good_analysis` 10.3.x (sdk ^3.12.0) resolves.
  # The `flutter` floor was previously absent entirely, which is how production
  # drifted to a 3.41.9 builder while everyone developed on 3.44.4 — keep this
  # in step with cloudflare-build.sh and .github/workflows/deploy-cloudflare.yml.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Fonts & icons
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.19.0

  # PDF / Print
  pdf: ^3.11.1
  printing: ^5.13.4

  # Persistence (lightweight, for session)
  shared_preferences: ^2.3.3

  # UUID for ids
  uuid: ^4.5.1

  # Invoice file uploads
  file_picker: ^8.1.4

  # HTTP client
  dio: ^5.7.0

  # Secure storage for JWT (access + refresh).
  # 10.x is required for the WASM web build: 9.x pulls flutter_secure_storage_web
  # 1.2.1, which imports dart:html + dart:js_util unguarded and is registered in
  # the generated web plugin registrant, so dart2wasm compiles it and fails with
  # 47 errors. 10.3.1 pulls _web 2.1.x, which uses package:web.
  # Web behaviour is unaffected either way — token_storage.dart routes every web
  # read/write to shared_preferences and never reaches the secure plugin. NATIVE
  # needs a device smoke test: 10.0.0 changes the Android key/storage ciphers
  # (auto-migrating via migrateOnAlgorithmChange) and defaults resetOnError true.
  flutter_secure_storage: ^10.3.1

  # Maps — free OpenStreetMap stack for the route location picker.
  # flutter_map renders OSM tiles (no API key); geocoding/search goes through
  # the backend /maps proxy (Nominatim, also keyless).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Client-side .xlsx generation for the Reports "Download Excel" export.
  excel: ^4.0.6

  # Browser APIs for the web attachment viewer (Blob + object URLs). Replaces
  # dart:html, which is deprecated and unavailable under dart2wasm.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # One-command (re)generation of native launcher icons from icon/app_icon.png.
  # Web favicon / PWA icons are maintained separately under web/.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Listed file by file, not as a directory glob: the glob was shipping
  # vistar_logo.png (2.18 MB) which is referenced nowhere in lib/ or web/, and
  # would silently re-ship any stray file dropped into the folder.
  # NOTE: logo-symbol.png (2.1 MB) and vistar_logo_trimmed.png (1.5 MB) are
  # still far larger than their render size and want re-exporting — the *_pdf
  # variants below show ~60 KB is achievable.
  assets:
    - assets/images/logo-symbol.png
    - assets/images/logo_symbol_pdf.png
    - assets/images/vistar_logo_pdf.png
    - assets/images/vistar_logo_trimmed.png

# Native launcher icons — run `dart run flutter_launcher_icons` after changing
# icon/app_icon.png. Web icons are generated separately (web: false).
flutter_launcher_icons:
  image_path: "icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "icon/app_icon.png"
  windows:
    generate: true
    image_path: "icon/app_icon.png"
  web:
    generate: false
