# CI checks only — this workflow does NOT deploy.
#
# Production is deployed by Cloudflare Pages' own Git integration, which runs
# `bash cloudflare-build.sh` (set as the project's Build command) and publishes
# build/web. Publishing from here as well would mean two deploys racing for the
# same commit, so the publish step was removed.
#
# What this still buys us: analyze/test/build run in ~3 minutes and go red on a
# broken commit, instead of that commit surfacing 10 minutes later as a failed
# Cloudflare build. Note it does NOT block the deploy — Cloudflare builds the
# push regardless — so treat a red run here as "fix it now", not "it's contained".
name: CI — Flutter web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Filename stays deploy-cloudflare.yml so the run history and the links in
  # DEPLOYMENT.md survive, even though this no longer deploys.
  checks:
    runs-on: ubuntu-latest
    name: Analyze, test and build Flutter web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # MUST equal FLUTTER_VERSION in cloudflare-build.sh — the step below
          # fails the run if they drift. Cloudflare compiles production with that
          # value, so a mismatch here means CI green / production red.
          flutter-version: 3.44.4
          cache: true

      - name: Verify Flutter
        run: flutter --version

      # Guards the drift that let production build on 3.41.9 while the team ran
      # 3.44.4 for months.
      - name: Flutter pin matches the production build script
        run: |
          ci_pin="3.44.4"
          prod_pin="$(sed -n 's/^FLUTTER_VERSION="\(.*\)"$/\1/p' cloudflare-build.sh)"
          echo "CI pin: $ci_pin / cloudflare-build.sh pin: $prod_pin"
          if [ "$ci_pin" != "$prod_pin" ]; then
            echo "::error::Flutter pin mismatch — CI checks would not predict the production build."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # CLAUDE.md §12/§13.2. Kept ahead of analyze because a formatting diff is
      # the cheapest possible failure to read.
      - name: Format
        run: dart format --set-exit-if-changed .

      # CLAUDE.md §13.1 wants --fatal-infos --fatal-warnings, and the tree is at
      # zero issues as of the dart:html removal, so the strict gate holds.
      #
      # Caveat: verified on Flutter 3.44.4 locally, while this job pins 3.41.9 to
      # match cloudflare-build.sh (see "Set up Flutter" above). A different SDK
      # ships a different analyzer, so if this step goes red on an info-level
      # lint that never fires locally, align the two versions rather than
      # loosening the gate back to --no-fatal-infos.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # --coverage writes coverage/lcov.info. No threshold is enforced yet: the
      # suite is 76 widget/unit tests and nowhere near §12's >=60% overall bar,
      # so a gate here would just be permanently red. Publish the number first,
      # then ratchet.
      - name: Test
        run: flutter test --coverage

      - name: Build web (release)
        # Current Flutter no longer keeps a caching service worker: the build
        # emits a self-unregistering CLEANUP flutter_service_worker.js that
        # removes any worker an older build installed and reloads the tab. Paired
        # with the no-cache headers on that file (web/_headers), every deploy
        # reaches every user — no manual cache clearing. Do NOT overwrite the
        # generated worker; flutter.js coordinates its version with it.
        # Kept as a CHECK, not as the artifact source: Cloudflare rebuilds from
        # source itself. This is here so a compile error fails in ~3 min rather
        # than after Cloudflare has spent ~10 min cloning the Flutter SDK.
        # Must stay byte-for-byte the same command as cloudflare-build.sh's
        # final line, or this stops predicting what Cloudflare will do.
        run: flutter build web --release --base-href "/"
