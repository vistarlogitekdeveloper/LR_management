name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Flutter web and publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Info-level lints (style / deprecation hints) must not block a deploy;
      # warnings and errors still fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web (release)
        # Current Flutter no longer keeps a caching service worker: the build
        # emits a self-unregistering CLEANUP flutter_service_worker.js that
        # removes any worker an older build installed and reloads the tab. Paired
        # with the no-cache headers on that file (web/_headers), every deploy
        # reaches every user — no manual cache clearing. Do NOT overwrite the
        # generated worker; flutter.js coordinates its version with it.
        run: flutter build web --release --base-href "/"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Pages PROJECT is named vistar-transport-management-system; it
          # keeps the lr-management.pages.dev domain from before it was renamed.
          # Deploying to --project-name=lr-management targeted a project that no
          # longer exists, so this step never published — verified 2026-08-27
          # against `wrangler pages project list`.
          command: pages deploy build/web --project-name=vistar-transport-management-system --branch=main
