<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vistar Transport Management System (VTMS) — create lorry receipts, track consignments, manage masters and freight billing.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VTMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Vistar Transport Management System (VTMS)</title>
  <link rel="manifest" href="manifest.json">

  <!--
    No Google Maps <script> tag here, on purpose.

    The Maps JavaScript SDK is injected at runtime by
    lib/features/maps/utils/maps_loader.dart, using the key from
    --dart-define=GOOGLE_MAPS_BROWSER_KEY. It used to be loaded here as well,
    which meant the key had to arrive through two channels that could disagree —
    a sed substitution into this file AND the define — and a build where only one
    of them landed fell back to OpenStreetMap with no way to tell from the app.
    One channel cannot disagree with itself.

    Deferring is safe: GoogleMapsPlugin.registerWith() only assigns the platform
    instance, and nothing touches `google.maps` until the GoogleMap WIDGET
    builds — which PickerMap does not do until the load resolves.

    It also means a developer can see the Google map locally with nothing but the
    define, instead of editing this tracked file and risking a live key in a
    commit. The key is a BROWSER key and is visible to anyone who views source;
    the HTTP referrer restriction on it is what protects it, not secrecy.
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
