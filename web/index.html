<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vistar Transport Management System (VTMS) — create lorry receipts, track consignments, manage masters and freight billing.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VTMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>Vistar Transport Management System (VTMS)</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript SDK — draws the map inside the location picker.

    THE KEY IN THE LINE BELOW IS A PLACEHOLDER AND IS NOT VALID AS IT STANDS.
    cloudflare-build.sh substitutes it from the GOOGLE_MAPS_BROWSER_KEY
    environment variable at build time, and DELETES this whole script when that
    variable is unset — so a build without a key ships no script, `google.maps`
    never appears, and the picker draws OpenStreetMap exactly as it always has.
    Never commit a real key here.

    (This comment deliberately does not spell the placeholder token out: the
    substitution is a plain global replace, so a second occurrence here would
    print the live key into the page source twice over.)

    Loaded synchronously, on purpose: google_maps_flutter_web expects
    `google.maps` to exist before the first map widget builds, and it has no
    hook to wait on. `async`/`defer` would race the picker.

    This key is a BROWSER key and is visible to anyone who views source. That is
    unavoidable for this API and is not the thing protecting it — the HTTP
    referrer restriction on the key is. Keep that restriction to the Pages
    domains, and keep this key restricted to Maps JavaScript API alone; place
    SEARCH goes through our own server, which uses a separate server key.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_BROWSER_KEY__"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
